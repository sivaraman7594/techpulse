name: Update TechPulse

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by a few minutes at busy times
  workflow_dispatch:
    inputs:
      force_all:
        description: "Fetch every source now (ignore schedules)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # keep-alive commit
  pages: write
  id-token: write

concurrency:
  group: techpulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch all sources
        env:
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }} 
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
        run: python fetcher/fetch.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in repos with no commits for 60 days.
      - name: Keep schedule alive
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt 4320000 ]; then
            git config user.name "techpulse-bot"
            git config user.email "techpulse-bot@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "Keep scheduled updates alive"
            git push
          fi
